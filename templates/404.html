{% extends "base.html" %}
{% block title %}Página no encontrada — DiabetesTracker{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">404</div>
  <div class="error-icon"><i class="bi bi-search"></i></div>
  <h2 class="error-title">Página no encontrada</h2>
  <p class="error-body">La URL que buscás no existe o fue movida.</p>
  <a href="{{ url_for('dashboard') }}" class="btn-list-add">
    <i class="bi bi-house-fill"></i> Volver al inicio
  </a>
</div>
{% endblock %}
{% block scripts %}
<style>
.error-page {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 4rem 1rem; text-align: center; gap: .5rem;
}
.error-code {
  font-size: 6rem; font-weight: 900; line-height: 1;
  background: linear-gradient(135deg, #6366f1, #a5b4fc);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.error-icon { font-size: 2.5rem; color: var(--text-muted); margin-bottom: .5rem; }
.error-title { font-size: 1.5rem; font-weight: 700; margin: 0; }
.error-body  { color: var(--text-muted); font-size: .95rem; margin-bottom: 1.5rem; }
</style>
{% endblock %}
