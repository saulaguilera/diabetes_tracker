<!DOCTYPE html>
<html lang="es" id="login-html">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear cuenta — Orbit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root { --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #0f172a; }
    [data-theme="dark"] {
      --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #e2e8f0;
    }
    body {
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem 2rem;
      width: 100%; max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .brand-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: #6366f1; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 1rem;
    }
    .form-control {
      background: var(--bg) !important; border-color: var(--border) !important;
      color: var(--text) !important; padding: .65rem 1rem;
    }
    .form-label { font-size: .85rem; font-weight: 600; color: var(--text); }
    .btn-login {
      background: #6366f1; color: white; border: none;
      padding: .65rem; font-weight: 600; border-radius: 8px;
    }
    .btn-login:hover { background: #4f46e5; color: white; }
    .input-group-text {
      background: var(--bg) !important; border-color: var(--border) !important;
      color: var(--text) !important;
    }
  </style>
  <script>
    (function() {
      const t = localStorage.getItem('theme') || 'light';
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon"><i class="bi bi-stars text-white fs-4"></i></div>
    <h1 class="text-center fw-bold mb-1" style="font-size:1.3rem;">Crear tu cuenta Orbit</h1>
    <p class="text-center text-muted mb-4" style="font-size:.83rem;">Necesitás un código de invitación</p>

    {% if error %}
    <div class="alert alert-danger py-2 mb-3 d-flex align-items-center gap-2" style="font-size:.84rem;">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      {{ error }}
    </div>
    {% endif %}

    {% if not enabled %}
    <div class="alert alert-secondary py-2 mb-3" style="font-size:.84rem;">
      El registro está deshabilitado por ahora.
    </div>
    {% else %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="invite">Código de invitación</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-ticket-perforated"></i></span>
          <input type="text" class="form-control" id="invite" name="invite" autofocus required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="username">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" name="username"
                 autocomplete="username" required minlength="3">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password"
                 autocomplete="new-password" required minlength="8">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirm">Repetir contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" class="form-control" id="confirm" name="confirm"
                 autocomplete="new-password" required minlength="8">
        </div>
      </div>
      <button type="submit" class="btn btn-login w-100">
        <i class="bi bi-person-plus me-2"></i>Crear cuenta
      </button>
    </form>
    {% endif %}

    <p class="text-center text-muted mt-4 mb-0" style="font-size:.75rem;">
      ¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a>
    </p>
  </div>
</body>
</html>
