<!DOCTYPE html>
<html lang="es" id="login-html">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión — DiabetesTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root { --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #0f172a; }
    [data-theme="dark"] {
      --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #e2e8f0;
    }
    body {
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      transition: background .2s, color .2s;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem 2rem;
      width: 100%; max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .brand-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: #ef4444; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 1rem;
    }
    .form-control {
      background: var(--bg) !important; border-color: var(--border) !important;
      color: var(--text) !important; padding: .65rem 1rem;
    }
    .form-control:focus { box-shadow: 0 0 0 3px rgba(99,102,241,.25); }
    .form-label { font-size: .85rem; font-weight: 600; color: var(--text); }
    .btn-login {
      background: #6366f1; color: white; border: none;
      padding: .65rem; font-weight: 600; border-radius: 8px;
      transition: background .15s;
    }
    .btn-login:hover { background: #4f46e5; color: white; }
    .input-group-text {
      background: var(--bg) !important; border-color: var(--border) !important;
      color: var(--text) !important;
    }
  </style>
  <script>
    (function() {
      const t = localStorage.getItem('theme') || 'light';
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body>
  <div class="login-card">

    <!-- Logo -->
    <div class="brand-icon">
      <i class="bi bi-heart-pulse-fill text-white fs-4"></i>
    </div>
    <h1 class="text-center fw-bold mb-1" style="font-size:1.3rem;">DiabetesTracker</h1>
    <p class="text-center text-muted mb-4" style="font-size:.83rem;">Ingresá para continuar</p>

    <!-- Error -->
    {% if error %}
    <div class="alert alert-danger py-2 mb-3 d-flex align-items-center gap-2" style="font-size:.84rem;">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      {{ error }}
    </div>
    {% endif %}

    <!-- Formulario -->
    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="username">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" name="username"
                 placeholder="admin" autocomplete="username" autofocus required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="input-group-text" id="toggle-pass"
                  style="cursor:pointer;" title="Mostrar contraseña">
            <i class="bi bi-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-login w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>

    <p class="text-center text-muted mt-4 mb-0" style="font-size:.75rem;">
      <i class="bi bi-shield-lock me-1"></i>Acceso privado · datos de salud personales
    </p>
  </div>

  <script>
    // Toggle mostrar/ocultar contraseña
    document.getElementById('toggle-pass').addEventListener('click', function() {
      const inp  = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });
  </script>
</body>
</html>
