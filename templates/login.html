<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Orbit — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Outfit', -apple-system, system-ui, sans-serif;
      background: radial-gradient(125% 90% at 50% -8%, #16243F 0%, #0B1324 46%, #060B18 100%);
      color: #EAF2F8; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; overflow: hidden; position: relative;
    }
    /* glows ambientales de la app */
    .glow { position: fixed; inset: -15%; pointer-events: none; z-index: 0;
      background:
        radial-gradient(55% 30% at 18% 8%, rgba(139,92,246,0.13) 0%, transparent 70%),
        radial-gradient(50% 28% at 88% 60%, rgba(34,211,238,0.10) 0%, transparent 70%),
        radial-gradient(45% 26% at 50% 100%, rgba(56,189,248,0.08) 0%, transparent 70%); }
    .star { position: fixed; border-radius: 50%; background: #fff; pointer-events: none; z-index: 0;
      animation: tw 3.4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .18 } 50% { opacity: .65 } }
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 400px;
      background: rgba(255,255,255,0.045); border: 0.5px solid rgba(255,255,255,0.085);
      border-radius: 26px; padding: 36px 28px calc(30px + env(safe-area-inset-bottom));
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .brand { display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 6px; }
    .wordmark { font-size: 21px; font-weight: 300; letter-spacing: .01em; display: flex; align-items: center; gap: 7px; }
    .wordmark .grad { font-weight: 500;
      background: linear-gradient(100deg, #22D3EE 0%, #38BDF8 42%, #8B5CF6 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .ai { font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 6px;
      color: #8B5CF6; background: rgba(139,92,246,0.14); border: 0.5px solid rgba(139,92,246,0.4); }
    .sub { text-align: center; color: rgba(234,242,248,0.60); font-size: 13.5px; margin-bottom: 26px; }
    .error { background: rgba(224,122,106,0.12); border: 0.5px solid rgba(224,122,106,0.4);
      color: #E8A79B; border-radius: 14px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
    label { display: block; color: rgba(234,242,248,0.60); font-size: 13px; margin: 0 0 7px 2px; }
    input {
      width: 100%; padding: 13px 15px; border-radius: 14px; font-size: 15px;
      font-family: inherit; color: #EAF2F8; outline: none; margin-bottom: 16px;
      background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.12);
      transition: border-color .2s;
    }
    input:focus { border-color: rgba(34,211,238,0.55); }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 100px; cursor: pointer;
      background: #22D3EE; color: #0A0C1E; font-family: inherit;
      font-size: 15px; font-weight: 600; margin-top: 6px; transition: opacity .15s;
    }
    button:active { opacity: .8; }
    .foot { text-align: center; color: rgba(234,242,248,0.34); font-size: 12px; margin-top: 22px; line-height: 1.6; }
    .foot a { color: #22D3EE; text-decoration: none; }
    svg { display: block; overflow: visible; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="star" style="top:12%; left:14%; width:2px; height:2px;"></div>
  <div class="star" style="top:22%; left:78%; width:3px; height:3px; animation-delay:.7s;"></div>
  <div class="star" style="top:64%; left:8%;  width:2px; height:2px; animation-delay:1.3s;"></div>
  <div class="star" style="top:78%; left:86%; width:2px; height:2px; animation-delay:2s;"></div>
  <div class="star" style="top:42%; left:92%; width:2px; height:2px; animation-delay:.4s;"></div>
  <div class="star" style="top:88%; left:38%; width:3px; height:3px; animation-delay:1.7s;"></div>
  <div class="star" style="top:8%;  left:52%; width:2px; height:2px; animation-delay:2.4s;"></div>

  <div class="card">
    <div class="brand">
      <!-- logo Orbit: anillo cyan→violeta + núcleo + satélite -->
      <svg width="30" height="30" viewBox="0 0 120 120">
        <defs>
          <linearGradient id="r" x1="0" y1="0" x2="1" y2="1.1">
            <stop offset="0%" stop-color="#22D3EE"/><stop offset="45%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#8B5CF6"/>
          </linearGradient>
          <radialGradient id="c" cx="44%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#FFFFFF"/><stop offset="35%" stop-color="#5FE3F5"/>
            <stop offset="72%" stop-color="#22D3EE" stop-opacity="0.7"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="60" cy="60" r="44" fill="none" stroke="url(#r)" stroke-width="6.5" stroke-linecap="round"/>
        <circle cx="60" cy="60" r="25" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="2 4.5" opacity="0.5"/>
        <circle cx="60" cy="60" r="13" fill="url(#c)"/>
        <circle cx="60" cy="60" r="6" fill="#FFFFFF"/>
        <circle cx="94" cy="32" r="4" fill="#FFFFFF"/>
        <circle cx="94" cy="32" r="4" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
      </svg>
      <span class="wordmark">Orbit <span class="grad">Copilot</span> <span class="ai">AI</span></span>
    </div>
    <p class="sub">Tu copiloto metabólico</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>

    <p class="foot">
      ¿Tienes un código de invitación? <a href="/registro">Crea tu cuenta</a><br>
      Acceso privado · datos de salud personales
    </p>
  </div>
</body>
</html>
